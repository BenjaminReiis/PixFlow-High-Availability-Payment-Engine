version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payments?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_dev
      JWT_ISSUER: payment-ledger
      JWT_AUDIENCE: payment-ledger-users
      IDEMPOTENCY_TTL_SECONDS: 86400
      LOCK_TTL_MS: 8000
      QUEUE_POLL_INTERVAL_MS: 500
      WORKER_CONCURRENCY: 8
      MAX_RETRY: 7
    ports:
      - "3000:3000"
    command: ["node", "dist/server.js"]
